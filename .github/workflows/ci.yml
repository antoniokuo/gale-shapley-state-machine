name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Enforce Linting & Hygiene
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Run Algorithmic Tests
        run: npm run test:unit

      - name: Validate Production Build
        run: npm run build

        - name: Install Ruff (Python Linter)
        run: pip install ruff

      - name: Enforce Python Hygiene
        run: ruff check scripts/etl/
